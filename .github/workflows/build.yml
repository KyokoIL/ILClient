name: Build ILClient Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ilclient-apk:
    name: Compile Native Core & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout ILClient Repository
        uses: actions/checkout@v4

      - name: 2. Patch Gradle ABI Filter Conflict & Clean Stray Files
        run: |
          rm -f kossher
          if [ -f "app/build.gradle.kts" ]; then
            sed -i '/ndk {/,/}/d' app/build.gradle.kts
          fi
          ls -la

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configure Pre-installed Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager at: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: 5. Fetch Prebuilt Xray Core Android AAR (libXray)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          curl -fL --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" \
            -o "$GITHUB_WORKSPACE/app/libs/libXray.aar" || rm -f "$GITHUB_WORKSPACE/app/libs/libXray.aar"
          ls -lh "$GITHUB_WORKSPACE/app/libs/"

      - name: 6. Download GeoIP and Geosite Databases
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          curl -fL --retry 3 \
            "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat" \
            -o "$GITHUB_WORKSPACE/app/src/main/assets/geosite.dat"
          curl -fL --retry 3 \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat" \
            -o "$GITHUB_WORKSPACE/app/src/main/assets/geoip.dat"
          ls -lh "$GITHUB_WORKSPACE/app/src/main/assets/"

      - name: 7. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 8. Run Unit Tests (Bypass Iran & Routing Verification)
        run: |
          gradle testDebugUnitTest --stacktrace

      - name: 9. Assemble ILClient Debug APKs
        run: |
          gradle assembleDebug --stacktrace

      - name: 10. Upload Compiled ILClient APKs
        uses: actions/upload-artifact@v4
        with:
          name: ILClient-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
