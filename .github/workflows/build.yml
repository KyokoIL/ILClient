name: Build ILClient Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ilclient-apk:
    name: Compile Native Core & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout ILClient Repository
        uses: actions/checkout@v4

      - name: 2. Verify Project Structure (Flatten if Nested)
        run: |
          if [ -d "ILClient/app" ] && [ ! -d "app" ]; then
            echo "Flattening nested ILClient directory..."
            shopt -s dotglob
            mv ILClient/* .
            rmdir ILClient
          fi
          ls -la

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Accept Android SDK Licenses & Install Build Tools
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          set -o pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 6. Fetch Prebuilt Xray Core Android AAR (libXray)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          curl -sL --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" \
            -o "$GITHUB_WORKSPACE/app/libs/libXray.aar" || true
          ls -lh "$GITHUB_WORKSPACE/app/libs/"

      - name: 7. Download & Verify GeoIP and Geosite Databases
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          curl -sL --retry 3 \
            "https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat" \
            -o "$GITHUB_WORKSPACE/app/src/main/assets/geosite.dat"
          curl -sL --retry 3 \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat" \
            -o "$GITHUB_WORKSPACE/app/src/main/assets/geoip.dat"
          ls -lh "$GITHUB_WORKSPACE/app/src/main/assets/"

      - name: 8. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 9. Run Unit Tests (Bypass Iran & Routing Verification)
        run: |
          gradle testDebugUnitTest --stacktrace

      - name: 10. Assemble ILClient Debug APKs
        run: |
          gradle assembleDebug --stacktrace

      - name: 11. Upload Compiled ILClient APKs
        uses: actions/upload-artifact@v4
        with:
          name: ILClient-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
